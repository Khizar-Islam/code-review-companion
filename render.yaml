services:
  - type: web
    name: code-review-companion-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # GEMINI_MODELS is optional (see server/.env.example), so it is not listed here.
      # Set it in the Render dashboard to change the model order.
      - key: TRUST_PROXY_HOPS
        value: "3"
